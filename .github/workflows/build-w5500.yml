name: Build FluidNC 4.1.1 W5500 (ESP32-S3)

on:
  push:
    branches: [ fluidnc-4.1.1-w5500 ]
  workflow_dispatch:
    inputs:
      backtrace:
        description: "Optional: paste a 'Backtrace: 0x...' line to decode against this build"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-version.py uses git history for the version string

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build dpCREATOR WebUI into the filesystem image
        run: python3 webui/build.py --install

      - name: Build firmware (wifi_s3)
        run: pio run -e wifi_s3

      - name: Build merged flash image (bootloader + partitions + firmware + filesystem)
        run: pio run -e wifi_s3 -t build_merged

      - name: Collect binaries
        run: |
          # out/: only what is flashed. The WebUI page (it carries the Windows
          # network-drive script as text, which antivirus heuristics flag in a
          # downloaded archive) and the .elf (backtrace decoding) go to a
          # separate "debug" artifact.
          mkdir -p out debug
          B=.pio/build/wifi_s3
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin out/
          cp $B/littlefs.bin out/ 2>/dev/null || true
          cp $B/merged-flash.bin out/ 2>/dev/null || true
          cp $B/firmware.elf debug/
          cp webui/dist/index.html.gz debug/webui-index.html.gz
          ls -l out debug

      - name: Decode backtrace
        if: ${{ inputs.backtrace != '' }}
        env:
          BT: ${{ inputs.backtrace }}
        run: |
          A2L=$(find ~/.platformio/packages -name 'xtensa-esp32s3-elf-addr2line' -type f | head -1)
          [ -z "$A2L" ] && A2L=$(find ~/.platformio/packages -name '*addr2line' -type f | head -1)
          echo "Using $A2L"
          ADDRS=$(echo "$BT" | grep -oE '0x[0-9a-fA-F]{8}:0x[0-9a-fA-F]{8}' | cut -d: -f1 | tr '\n' ' ')
          echo "=== DECODED BACKTRACE ==="
          "$A2L" -pfiaC -e .pio/build/wifi_s3/firmware.elf $ADDRS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fluidnc-4.1.1-w5500-s3-${{ github.sha }}
          path: out/
          retention-days: 30

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-elf-webui-${{ github.sha }}
          path: debug/
          retention-days: 30
